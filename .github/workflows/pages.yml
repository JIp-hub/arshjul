name: Publicera Årshjulet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v6

      - name: Använd Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bygg minimalt publiceringspaket
        env:
          ARSHJUL_SUPABASE_URL: ${{ vars.ARSHJUL_SUPABASE_URL }}
          ARSHJUL_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARSHJUL_SUPABASE_PUBLISHABLE_KEY }}
          ARSHJUL_AUTH_REDIRECT_URL: ${{ vars.ARSHJUL_AUTH_REDIRECT_URL }}
          ARSHJUL_CONFIG_OUTPUT: ${{ github.workspace }}/_site/supabase-config.js
        run: |
          mkdir -p _site/js
          cp index.html _site/index.html
          cp js/supabase-adapter.js _site/js/supabase-adapter.js
          node scripts/build-supabase-config.mjs
          touch _site/.nojekyll

      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp webbpaket
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicera GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
